<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>VRM-риг</title>

  <style>
    body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
    #panel { position: fixed; top: 10px; left: 10px; z-index: 10; color: white; }
    canvas { display: block; }
    #video { display: block; width: 220px; margin-top: 10px; transform: scaleX(-1); border-radius: 8px; }
    #debug { font-size: 12px; margin-top: 8px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 6px; }
    #exprBox { font-size: 11px; max-width: 220px; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; margin-top: 8px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 6px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.min.js",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"
    }
  }
  </script>
</head>

<body>
  <div id="panel">
    <input type="file" id="fileInput" accept=".vrm">
    <br><br>
    <button id="cameraButton">Включить камеру</button>
    <button id="calibrateButton">Калибровка</button>
    <button id="resetButton">Сброс</button>
    <button id="bgButton">Фон: тёмный</button>
    <button id="bodyButton">Руки и плечи: выкл</button>
    <div style="font-size: 11px; margin-top: 4px;">H: скрыть или показать панель</div>
    <pre id="debug"></pre>
    <pre id="exprBox"></pre>
    <video id="video" autoplay playsinline muted></video>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
